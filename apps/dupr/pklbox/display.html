<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUPR Engine v.1 — Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Lilita+One&family=Jost:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&family=Lobster+Two:ital,wght@1,700&family=Unbounded:wght@800;900&family=Outfit:wght@500;600;700;800&family=Creepster&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2f332e; --navy-deep:#222622;
    --gold:#6cc144; --orange:#ff6600; --blue:#3992b9; --red:#bb1421;
    --bg:#121512; --surface:#1c211c; --surface-2:#212721;
    --text:#eef1ec; --muted:#9aa49a; --border:#2f372f;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
    --font-display:'Baloo 2'; --font-body:'Inter'; --win:#3ecb7c;
    --overlay:rgba(10,13,10,.86); --overlay-lb:rgba(10,13,10,.92);
  }
  html[data-theme="light"]{
    --gold:#3f8a22; --bg:#ececec; --surface:#ffffff; --surface-2:#f7f7f5;
    --text:#262a26; --muted:#6a706a; --border:#dcdddb;
    --shadow: 0 8px 24px rgba(38,42,38,0.1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);color:var(--text);font-family:var(--font-body),system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  h1,h2,h3,.headline{font-family:var(--font-display),system-ui,sans-serif;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:2vw;
    padding:0 2vw;height:11vh;flex-shrink:0;
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    box-shadow:var(--shadow);position:relative;z-index:5;
  }
  header.top .brand{display:flex;align-items:center;}
  header.top .brand img{height:8.6vh;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
  header.top h1{margin:0;color:#fff;font-size:min(4.8vh,2.4vw);font-weight:800;text-align:center;letter-spacing:.2px;}
  header.top .brand.right img{height:8.2vh;border-radius:1vh;}
  .theme-toggle{position:absolute;top:8px;right:8px;width:40px;height:22px;background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.3);border-radius:14px;cursor:pointer;z-index:10;opacity:.6;}
  .theme-toggle .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--gold);
    transition:transform .2s ease;font-size:9px;display:flex;align-items:center;justify-content:center;}
  html[data-theme="light"] .theme-toggle .knob{transform:translateX(18px);background:var(--blue);}

  main{flex:1;display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:1.2vw;padding:1.6vh 1.2vw;overflow:hidden;min-height:0;}
  .col{display:grid;grid-template-rows:1fr 1fr;gap:1.6vh;min-height:0;min-width:0;}

  .court-card{
    background:var(--surface);border:.45vh solid var(--border);border-radius:2vh;
    padding:1.6vh 1.5vw;box-shadow:var(--shadow);display:flex;flex-direction:column;
    justify-content:space-between;min-height:0;min-width:0;overflow:hidden;
  }
  .court-card.playing{border-color:var(--orange);}
  .court-card.assigned{border-color:var(--blue);}
  .court-num{
    font-family:var(--font-display);font-weight:800;font-size:min(4vh,2.2vw);color:var(--muted);
    text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;justify-content:space-between;line-height:1;
  }
  .court-status-pill{font-size:min(2.3vh,1.25vw);font-weight:800;padding:.6vh 1vw;border-radius:5vh;color:#fff;letter-spacing:0;}
  .court-status-pill.free{background:#2e9e5b;}
  .court-status-pill.playing{background:var(--orange);}
  .court-status-pill.assigned{background:var(--blue);}
  .players{display:flex;flex-direction:column;min-width:0;}
  .players .p{font-family:var(--font-display);font-weight:800;font-size:min(4.6vh,2.7vw);line-height:1.1;white-space:nowrap;overflow:hidden;}
  .players .vs{color:var(--gold);font-family:var(--font-display);font-weight:800;font-size:min(2.6vh,1.5vw);margin:.5vh 0;letter-spacing:.2em;}
  .court-card .timer{font-family:var(--font-display);font-weight:800;font-size:min(8.6vh,5vw);line-height:1;color:var(--gold);
    text-align:center;font-variant-numeric:tabular-nums;}
  .court-card .ready-note{font-family:var(--font-display);font-weight:800;font-size:min(4vh,2.3vw);line-height:1;color:var(--blue);text-align:center;}
  .court-card .free-label{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;
    font-size:min(6vh,3.4vw);color:var(--muted);}

  .center-col{display:flex;flex-direction:column;min-height:0;min-width:0;}
  .center-title{font-family:var(--font-display);font-weight:800;font-size:min(4.4vh,2.5vw);text-align:center;line-height:1;
    color:var(--gold);text-transform:uppercase;letter-spacing:.12em;margin-bottom:1.4vh;}
  .next-list{flex:1;display:grid;grid-template-rows:repeat(6,1fr);gap:1.4vh;min-height:0;}
  .next-item{background:var(--surface);border:.2vh solid var(--border);border-left:1vh solid var(--blue);
    border-radius:1.6vh;padding:0 1.2vw;box-shadow:var(--shadow);display:flex;align-items:center;gap:1.2vw;
    min-height:0;min-width:0;overflow:hidden;}
  .next-item.onhold{border-left-color:var(--muted);}
  .next-item.onhold .pos,.next-item.onhold .info{opacity:.45;}
  .next-item .hold-tag{font-family:var(--font-display);font-weight:800;font-size:min(3.2vh,1.8vw);color:var(--gold);flex-shrink:0;white-space:nowrap;}
  .next-item.empty{border-style:dashed;border-left-style:dashed;box-shadow:none;background:transparent;opacity:.45;}
  .next-item .pos{font-family:var(--font-display);font-weight:800;font-size:min(6vh,3.4vw);color:var(--gold);width:3.2vw;text-align:center;flex-shrink:0;}
  .next-item .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .next-item .tline{font-family:var(--font-display);font-weight:800;font-size:min(4.1vh,2.3vw);line-height:1.12;white-space:nowrap;overflow:hidden;}
  .next-item .tline.b{color:var(--muted);}
  .next-item .tline.b span{color:var(--gold);font-size:.7em;letter-spacing:.15em;margin-right:.5em;}
  .next-item .empty-text{font-family:var(--font-display);font-weight:700;font-size:min(3.6vh,2vw);color:var(--muted);}

  /* Popups */
  .tv-overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;z-index:80;}
  .tv-overlay.show{display:flex;}
  .tv-popup{background:var(--surface);border-radius:28px;padding:clamp(30px,4vw,60px) clamp(40px,6vw,90px);
    text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.6);border:3px solid var(--gold);max-width:90vw;}
  .tv-popup.winner{border-color:#2e9e5b;}
  .tv-popup .kicker{font-family:var(--font-display);font-weight:800;font-size:min(5vh,3vw);color:var(--gold);
    text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;}
  .tv-popup.winner .kicker{color:var(--win);}
  .tv-popup .court-big{font-size:min(4.6vh,2.8vw);color:var(--muted);margin-bottom:18px;font-weight:600;}
  .tv-popup .teams-big{font-family:var(--font-display);font-weight:800;font-size:min(8.5vh,5.4vw);line-height:1.25;}
  .tv-popup .score-big{font-family:var(--font-display);font-weight:800;font-size:min(13vh,8vw);color:var(--gold);margin-top:14px;}
  .tv-popup .winner-name{font-family:var(--font-display);font-weight:800;font-size:min(10vh,6vw);color:var(--win);margin-top:6px;}

  @media (max-width: 900px){ html,body{height:auto;} body{overflow:auto;} main{grid-template-columns:1fr;} }
  .court-bucket{font-family:var(--font-display);font-weight:700;font-size:min(2.3vh,1.3vw);color:var(--gold);letter-spacing:0;text-transform:none;margin-left:.8vw;}
  .next-item .side{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;flex-shrink:0;max-width:14vw;}
  .next-item .bucket-sm{font-family:var(--font-display);font-weight:700;font-size:min(2.4vh,1.35vw);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1;}
  .players .team{display:flex;flex-direction:column;min-width:0;}
  /* queue hidden: courts take the whole screen (still 2 x 2), bigger type, team names side by side */
  body.no-queue main{grid-template-columns:1fr 1fr;}
  body.no-queue .center-col{display:none;}
  body.no-queue .court-num{font-size:min(5.2vh,3vw);}
  body.no-queue .court-status-pill{font-size:min(3vh,1.7vw);}
  body.no-queue .court-bucket{font-size:min(3vh,1.7vw);}
  body.no-queue .players .team{flex-direction:row;gap:1.4vw;}
  body.no-queue .players .team .p{font-size:min(7.4vh,4.4vw);min-width:0;flex:0 1 auto;}
  body.no-queue .players .team .p + .p::before{content:'& ';color:var(--muted);}
  body.no-queue .players .vs{font-size:min(3.6vh,2vw);margin:.8vh 0;}
  body.no-queue .court-card .timer{font-size:min(13vh,8vw);}
  body.no-queue .court-card .ready-note{font-size:min(5.6vh,3.2vw);}
  body.no-queue .court-card .free-label{font-size:min(8.4vh,5vw);}
  /* leaderboard popup (sits under the call / winner popups, z-index 80) */
  .lb-overlay{position:fixed;inset:0;background:var(--overlay-lb);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:70;padding:3vh 3vw;}
  .lb-overlay.show{display:flex;}
  .lb-title{font-family:var(--font-display);font-weight:800;font-size:min(7vh,4.2vw);color:var(--gold);text-transform:uppercase;letter-spacing:.12em;line-height:1;margin-bottom:.8vh;text-align:center;}
  .lb-sub{font-family:var(--font-display);font-weight:700;font-size:min(3vh,1.8vw);color:var(--muted);margin-bottom:3vh;text-align:center;}
  .lb-cols{display:grid;gap:2vw;width:100%;flex:1;min-height:0;}
  .lb-col{background:var(--surface);border:.4vh solid var(--border);border-radius:2vh;padding:2vh 1.6vw;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow);}
  .lb-col h3{margin:0 0 1.6vh;font-size:min(5vh,2.8vw);color:var(--gold);text-align:center;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lb-row{display:flex;align-items:center;gap:1vw;flex:1;min-height:0;border-top:.2vh solid var(--border);}
  .lb-row:first-of-type{border-top:none;}
  .lb-rank{font-family:var(--font-display);font-weight:800;font-size:min(6vh,3.4vw);color:var(--gold);width:3.4vw;text-align:center;flex-shrink:0;}
  .lb-name{flex:1;min-width:0;font-family:var(--font-display);font-weight:800;font-size:min(4.8vh,2.7vw);white-space:nowrap;overflow:hidden;}
  .lb-stat{font-family:var(--font-display);font-weight:800;font-size:min(3.4vh,1.9vw);color:var(--muted);text-align:right;flex-shrink:0;line-height:1.1;}
  .lb-stat b{color:var(--text);font-size:1.25em;}
  .lb-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--font-display);font-weight:700;font-size:min(4vh,2.2vw);}
  header.top h1{flex:1;min-width:0;}
  header.top .brand img{height:8.2vh;border-radius:1vh;}


  /* ===== Base polish (all themes) ===== */
  body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body.idle,body.idle *{cursor:none !important;}
  header.top h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .court-card{position:relative;transition:border-color .4s ease,box-shadow .4s ease;}
  .court-card.playing{box-shadow:var(--shadow),0 0 3vh rgba(255,102,0,.18);}
  .court-card.assigned{box-shadow:var(--shadow),0 0 3vh rgba(57,146,185,.2);}
  .court-status-pill{display:inline-flex;align-items:center;gap:.45vw;white-space:nowrap;}
  .court-status-pill.playing::before{content:'';width:1vh;height:1vh;border-radius:50%;background:#fff;animation:livePulse 1.4s ease-in-out infinite;}
  @keyframes livePulse{50%{opacity:.25;transform:scale(.7);}}
  .timer i{font-style:normal;}
  .next-item .pos{display:flex;align-items:center;justify-content:center;width:7vh;height:7vh;border-radius:50%;
    background:rgba(128,128,128,.14);font-size:min(4.8vh,2.7vw);line-height:1;}
  .next-item{transition:opacity .3s ease;}

  /* ===== Event themes (posters): Beach Bros + Dink Queens & Divas ===== */
  html[data-theme="beach"]{
    --navy:#0e5566; --navy-deep:#073441; --gold:#d8450e; --orange:#f06a1f; --blue:#14a0b5; --red:#bb1421;
    --surface:rgba(255,238,226,.82); --surface-2:rgba(255,238,226,.92);
    --text:#0b3f4e; --muted:#3a6e7b; --border:rgba(255,255,255,.85);
    --shadow:0 10px 28px rgba(60,20,70,.28);
    --font-display:'Lilita One'; --font-body:'Jost'; --win:#0a8a5c;
    --overlay:rgba(7,52,65,.86); --overlay-lb:rgba(7,52,65,.93);
  }
  html[data-theme="dink"]{
    --navy:#ec2a83; --navy-deep:#c8337f; --gold:#e1247a; --orange:#e1247a; --blue:#8e6cc9; --red:#bb1421;
    --surface:rgba(255,255,255,.9); --surface-2:#fff7fb;
    --text:#3a2631; --muted:#8d6a7d; --border:#f6bcd3;
    --shadow:0 10px 26px rgba(214,69,127,.2);
    --font-display:'Playfair Display'; --font-body:'Jost'; --win:#17965b;
    --overlay:rgba(70,20,50,.84); --overlay-lb:rgba(70,20,50,.92);
  }
  html[data-theme="beach"] body{
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='35%25' cy='30%25' r='80%25'><stop offset='0' stop-color='%23d9f57e'/><stop offset='.6' stop-color='%23a6d93c'/><stop offset='1' stop-color='%2381b52b'/></radialGradient></defs><circle cx='50' cy='50' r='49' fill='url(%23g)'/><g fill='%2354801c' fill-opacity='.75'><circle cx='30' cy='28' r='5'/><circle cx='55' cy='20' r='5'/><circle cx='76' cy='34' r='5'/><circle cx='20' cy='52' r='5'/><circle cx='45' cy='46' r='5'/><circle cx='68' cy='58' r='5'/><circle cx='34' cy='72' r='5'/><circle cx='58' cy='80' r='5'/><circle cx='80' cy='76' r='4'/></g></svg>") no-repeat -6vh 62vh/26vh,
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='35%25' cy='30%25' r='80%25'><stop offset='0' stop-color='%23d9f57e'/><stop offset='.6' stop-color='%23a6d93c'/><stop offset='1' stop-color='%2381b52b'/></radialGradient></defs><circle cx='50' cy='50' r='49' fill='url(%23g)'/><g fill='%2354801c' fill-opacity='.75'><circle cx='30' cy='28' r='5'/><circle cx='55' cy='20' r='5'/><circle cx='76' cy='34' r='5'/><circle cx='20' cy='52' r='5'/><circle cx='45' cy='46' r='5'/><circle cx='68' cy='58' r='5'/><circle cx='34' cy='72' r='5'/><circle cx='58' cy='80' r='5'/><circle cx='80' cy='76' r='4'/></g></svg>") no-repeat calc(100% + 5vh) 72vh/22vh,
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='35%25' cy='30%25' r='80%25'><stop offset='0' stop-color='%23d9f57e'/><stop offset='.6' stop-color='%23a6d93c'/><stop offset='1' stop-color='%2381b52b'/></radialGradient></defs><circle cx='50' cy='50' r='49' fill='url(%23g)'/><g fill='%2354801c' fill-opacity='.75'><circle cx='30' cy='28' r='5'/><circle cx='55' cy='20' r='5'/><circle cx='76' cy='34' r='5'/><circle cx='20' cy='52' r='5'/><circle cx='45' cy='46' r='5'/><circle cx='68' cy='58' r='5'/><circle cx='34' cy='72' r='5'/><circle cx='58' cy='80' r='5'/><circle cx='80' cy='76' r='4'/></g></svg>") no-repeat 94% -9vh/20vh,
      linear-gradient(160deg,#3d73c6 0%,#a45bb8 26%,#f2706b 58%,#f08a5d 76%,#e87aa6 100%);
    background-attachment:fixed;
  }
  html[data-theme="dink"] body{
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='35%25' cy='30%25' r='80%25'><stop offset='0' stop-color='%23d9f57e'/><stop offset='.6' stop-color='%23a6d93c'/><stop offset='1' stop-color='%2381b52b'/></radialGradient></defs><circle cx='50' cy='50' r='49' fill='url(%23g)'/><g fill='%2354801c' fill-opacity='.75'><circle cx='30' cy='28' r='5'/><circle cx='55' cy='20' r='5'/><circle cx='76' cy='34' r='5'/><circle cx='20' cy='52' r='5'/><circle cx='45' cy='46' r='5'/><circle cx='68' cy='58' r='5'/><circle cx='34' cy='72' r='5'/><circle cx='58' cy='80' r='5'/><circle cx='80' cy='76' r='4'/></g></svg>") no-repeat calc(100% + 4vh) 66vh/22vh,
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='35%25' cy='30%25' r='80%25'><stop offset='0' stop-color='%23d9f57e'/><stop offset='.6' stop-color='%23a6d93c'/><stop offset='1' stop-color='%2381b52b'/></radialGradient></defs><circle cx='50' cy='50' r='49' fill='url(%23g)'/><g fill='%2354801c' fill-opacity='.75'><circle cx='30' cy='28' r='5'/><circle cx='55' cy='20' r='5'/><circle cx='76' cy='34' r='5'/><circle cx='20' cy='52' r='5'/><circle cx='45' cy='46' r='5'/><circle cx='68' cy='58' r='5'/><circle cx='34' cy='72' r='5'/><circle cx='58' cy='80' r='5'/><circle cx='80' cy='76' r='4'/></g></svg>") no-repeat 3% -8vh/18vh,
      radial-gradient(ellipse 34vh 26vh at 6% 22%,rgba(244,143,190,.55),transparent 70%),
      radial-gradient(ellipse 30vh 22vh at 96% 8%,rgba(244,143,190,.5),transparent 70%),
      radial-gradient(ellipse 36vh 22vh at 90% 96%,rgba(244,143,190,.5),transparent 70%),
      linear-gradient(180deg,#fdf8ef 0%,#f9eef1 55%,#e4d3ee 100%);
    background-attachment:fixed;
  }
  html[data-theme="beach"] .court-card,html[data-theme="beach"] .next-item,html[data-theme="beach"] .lb-col,
  html[data-theme="dink"] .court-card,html[data-theme="dink"] .next-item,html[data-theme="dink"] .lb-col{backdrop-filter:blur(8px);}
  html[data-theme="beach"] .court-card,html[data-theme="beach"] .lb-col{border-radius:3vh;}
  html[data-theme="beach"],html[data-theme="beach"] *{font-synthesis:none;}
  html[data-theme="dink"] .court-card,html[data-theme="dink"] .timer,html[data-theme="dink"] .next-item,html[data-theme="dink"] .lb-col{font-variant-numeric:lining-nums tabular-nums;}
  html[data-theme="dink"] .court-card .timer,html[data-theme="dink"] .pos{font-family:'Jost',sans-serif;font-weight:800;}
  html[data-theme="beach"] .court-num,html[data-theme="beach"] .center-title{letter-spacing:.06em;}
  html[data-theme="dink"] .center-title,html[data-theme="dink"] .lb-title{font-family:'Lobster Two',cursive;font-style:italic;font-weight:700;text-transform:none;letter-spacing:.02em;font-size:min(5.6vh,3.2vw);}
  html[data-theme="dink"] .lb-title{font-size:min(8.4vh,5vw);}
  html[data-theme="dink"] .players .vs{font-family:'Lobster Two',cursive;font-style:italic;letter-spacing:.08em;}
  html[data-theme="dink"] .tv-popup .kicker{font-family:'Lobster Two',cursive;font-style:italic;text-transform:none;letter-spacing:.02em;}
  /* header title = the poster headline treatment */
  html[data-theme="beach"] header.top{border-bottom:.6vh solid #f08a3c;}
  html[data-theme="beach"] header.top h1{font-family:'Lilita One';font-weight:400;text-transform:uppercase;letter-spacing:.05em;color:#1fb6cc;
    font-size:min(6vh,3.3vw);-webkit-text-stroke:.5vh #fff;paint-order:stroke fill;text-shadow:0 .7vh 0 #e8782b,0 1.1vh .8vh rgba(0,0,0,.35);}
  html[data-theme="dink"] header.top{border-bottom:.6vh solid #f9b7d3;}
  html[data-theme="dink"] header.top h1{font-family:'Lobster Two',cursive;font-style:italic;font-weight:700;color:#fff;

  html[data-theme="halloween"] .court-bucket{font-family:var(--hw-font);font-weight:400;letter-spacing:.06em;}
  html[data-theme="halloween"] .court-status-pill{font-family:var(--hw-font);font-weight:400;letter-spacing:.06em;}
  html[data-theme="halloween"] .court-status-pill.free{background:#3a2552;color:#eadbff;}
  html[data-theme="halloween"] .court-status-pill.free::before{content:'\1F47B';}
  html[data-theme="halloween"] .court-status-pill.playing{background:#b3121c;}
  html[data-theme="halloween"] .court-status-pill.playing::before{content:'\1FA78';width:auto;height:auto;background:none;border-radius:0;animation:none;}
  html[data-theme="halloween"] .court-status-pill.assigned{background:var(--slime);color:#10320a;}
  html[data-theme="halloween"] .court-status-pill.assigned::before{content:'\1F9EA';}
  html[data-theme="halloween"] .players .p{text-shadow:0 .2vh .6vh rgba(0,0,0,.7);}
  html[data-theme="halloween"] .players .vs{font-family:var(--hw-font);font-weight:400;color:var(--pumpkin);letter-spacing:.18em;}
  html[data-theme="halloween"] .court-card .free-label{font-family:var(--hw-font);font-weight:400;color:rgba(255,200,160,.55);letter-spacing:.06em;}
  html[data-theme="halloween"] .court-card .free-label::before{content:'\26B0\FE0F  ';}
  html[data-theme="halloween"] .court-card .ready-note{font-family:var(--hw-font);font-weight:400;letter-spacing:.05em;color:var(--slime);
    text-shadow:0 0 1.4vh rgba(124,255,75,.65);animation:readyBlink 1.6s ease-in-out infinite;}
  @keyframes readyBlink{50%{opacity:.55;}}

  /* blood timer */
  html[data-theme="halloween"] .court-card .timer{position:relative;font-family:var(--hw-font);font-weight:400;letter-spacing:.06em;color:#fff1de;
    -webkit-text-stroke:.45vh #b3121c;paint-order:stroke fill;text-shadow:0 .5vh 0 #4d0409,0 0 2vh rgba(255,40,40,.75);}
  html[data-theme="halloween"] .court-card .timer{font-size:min(6.6vh,3.9vw);line-height:1.15;padding:.2vh 0 .6vh;flex-shrink:0;white-space:nowrap;overflow:visible;}
  html[data-theme="halloween"] body.no-queue .court-card .timer{font-size:min(10vh,6vw);}
  html[data-theme="halloween"] .timer i{display:inline-block;width:.64em;text-align:center;}
  html[data-theme="halloween"] .timer i.c{width:.32em;}
  html[data-theme="halloween"] .timer::before,html[data-theme="halloween"] .timer::after{content:'';position:absolute;top:58%;width:1.1vh;height:1.7vh;
    background:#d1121f;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;opacity:0;animation:hwDrop 3.4s ease-in infinite;}
  html[data-theme="halloween"] .timer::before{left:34%;}
  html[data-theme="halloween"] .timer::after{left:63%;animation-delay:1.5s;}
  @keyframes hwDrop{0%{transform:translateY(0) scale(.3);opacity:0;}15%{transform:translateY(.6vh) scale(1);opacity:1;}100%{transform:translateY(5vh) scale(1);opacity:0;}}

  /* up next */
  html[data-theme="halloween"] .center-title{font-family:var(--hw-font);font-weight:400;font-size:min(5.6vh,3.1vw);letter-spacing:.14em;color:var(--pumpkin);
    display:flex;align-items:center;justify-content:center;gap:1.2vw;text-shadow:0 0 2vh rgba(255,122,26,.55),.3vh .3vh 0 #000;}
  html[data-theme="halloween"] .center-title::before,html[data-theme="halloween"] .center-title::after{content:'\1F987';font-size:.8em;}
  html[data-theme="halloween"] .next-item{background:var(--surface);border:.2vh solid rgba(255,122,26,.35);border-left:1vh solid var(--pumpkin);
    border-radius:1.6vh;backdrop-filter:blur(4px);}
  html[data-theme="halloween"] .next-item:nth-child(even){border-left-color:#9b5de5;}
  html[data-theme="halloween"] .next-item .pos{font-family:var(--hw-font);font-weight:400;color:var(--pumpkin);background:rgba(255,122,26,.14);
    box-shadow:inset 0 0 0 .25vh rgba(255,122,26,.5);}
  html[data-theme="halloween"] .next-item:nth-child(even) .pos{color:#c9a0ff;background:rgba(155,93,229,.16);box-shadow:inset 0 0 0 .25vh rgba(155,93,229,.55);}
  html[data-theme="halloween"] .next-item.onhold{border-left-color:#6b5a66;}
  html[data-theme="halloween"] .next-item.empty{background:transparent;border-style:dashed;opacity:.4;}
  html[data-theme="halloween"] .next-item .hold-tag{font-family:var(--hw-font);font-weight:400;letter-spacing:.05em;}
  html[data-theme="halloween"] .next-item .tline.b span{font-family:var(--hw-font);font-weight:400;}

  /* popups */
  html[data-theme="halloween"] .tv-overlay{background:radial-gradient(ellipse at center,rgba(70,10,6,.88),rgba(8,2,2,.97));}
  html[data-theme="halloween"] .tv-popup{position:relative;background:linear-gradient(180deg,#26100a,#120604);border:.6vh solid var(--pumpkin);border-radius:3vh;
    box-shadow:0 0 8vh rgba(255,122,26,.45),0 3vh 9vh rgba(0,0,0,.7);}
  html[data-theme="halloween"] .tv-overlay.show .tv-popup{animation:hwPop .55s cubic-bezier(.2,1.4,.4,1);}
  @keyframes hwPop{from{transform:scale(.6) rotate(-4deg);opacity:0;}to{transform:none;opacity:1;}}
  html[data-theme="halloween"] .tv-popup::before{content:'\1F987';position:absolute;top:-5vh;left:-3vh;font-size:10vh;transform:rotate(-16deg);animation:batHover 2s ease-in-out infinite;}
  html[data-theme="halloween"] .tv-popup::after{content:'\1F578\FE0F';position:absolute;top:-3vh;right:-3vh;font-size:10vh;}
  html[data-theme="halloween"] .tv-popup.winner::before{content:'\1F9DB';}
  @keyframes batHover{50%{transform:translateY(-1.4vh) rotate(-8deg);}}
  html[data-theme="halloween"] .tv-popup .kicker{font-family:var(--hw-font);font-weight:400;letter-spacing:.08em;color:var(--pumpkin);text-shadow:0 0 2vh rgba(255,122,26,.6);}
  html[data-theme="halloween"] .tv-popup.winner{border-color:var(--slime);box-shadow:0 0 8vh rgba(124,255,75,.4),0 3vh 9vh rgba(0,0,0,.7);}
  html[data-theme="halloween"] .tv-popup.winner .kicker{color:var(--slime);text-shadow:0 0 2vh rgba(124,255,75,.55);}
  html[data-theme="halloween"] .tv-popup .score-big{font-family:var(--hw-font);font-weight:400;color:#fff1de;-webkit-text-stroke:.5vh #b3121c;paint-order:stroke fill;
    text-shadow:0 .6vh 0 #4d0409,0 0 3vh rgba(255,40,40,.7);}
  html[data-theme="halloween"] .tv-popup .winner-name{font-family:var(--hw-font);font-weight:400;letter-spacing:.04em;color:var(--slime);text-shadow:0 0 3vh rgba(124,255,75,.55);}

  /* leaderboard */
  html[data-theme="halloween"] .lb-title{font-family:var(--hw-font);font-weight:400;letter-spacing:.1em;color:var(--pumpkin);text-shadow:0 0 3vh rgba(255,122,26,.6),.3vh .3vh 0 #000;}
  html[data-theme="halloween"] .lb-col{background:rgba(22,10,8,.88);border:.4vh solid rgba(255,122,26,.5);border-radius:2.4vh;}

  html[data-theme="halloween"] .lb-rank{font-family:var(--hw-font);font-weight:400;}
  html[data-theme="halloween"] .lb-col .lb-row:nth-of-type(1) .lb-rank{text-shadow:0 0 2vh rgba(255,200,60,.9);}

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDhWLbY2QERNuOn7R-g8VljB4VTKW9RgEs",
  authDomain: "pklbox-e01b3.firebaseapp.com",
  projectId: "pklbox-e01b3",
  storageBucket: "pklbox-e01b3.firebasestorage.app",
  messagingSenderId: "197030960226",
  appId: "1:197030960226:web:529888c44967b2c30d853b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COURTS = 4;

/* Theme */
const html = document.documentElement;
const themeToggle = document.getElementById('themeToggle');
const themeKnob = document.getElementById('themeKnob');
/* ===== Halloween theme: halloween.js + tsParticles (loaded only when the theme is on) ===== */
const HW_CLASSES = ['halloween','halloween-eyes','halloween-witches','halloween-spider-drop','halloween-tombstones',
  'halloween-screen-left-top','halloween-screen-right-top','halloween-screen-left-bottom','halloween-screen-right-bottom'];
const HW_LIBS = {
  halloween:'https://cdn.jsdelivr.net/npm/halloween.js@1.0.3/dist/halloween.iife.js',
  slim:'https://cdn.jsdelivr.net/npm/@tsparticles/slim@3/tsparticles.slim.bundle.min.js',
  confetti:'https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3/tsparticles.confetti.bundle.min.js'
};
const hwLoaded = {};
function hwLoad(key){
  if(!hwLoaded[key]) hwLoaded[key] = new Promise(res => {
    const s = document.createElement('script'); s.src = HW_LIBS[key]; s.async = true;
    s.onload = () => res(true);
    s.onerror = () => { console.warn('Halloween lib failed to load:', key); res(false); };
    document.head.appendChild(s);
  });
  return hwLoaded[key];
}
let hwOn = false, hwEmbers = null, hwBusy = false, hwFlashTimer = null;
async function hwInit(){
  if(hwBusy || hwEmbers) return;
  hwBusy = true;
  hwLoad('halloween');
  const ok = await hwLoad('slim');
  if(ok && hwOn && typeof tsParticles !== 'undefined'){
    const eng = tsParticles; /* keep one engine reference: the confetti bundle ships its own */
    try{
      if(typeof loadSlim === 'function') await loadSlim(eng);
      const c = await eng.load({ id:'hwEmbers', options:{
        fullScreen:{ enable:false }, fpsLimit:30, detectRetina:true, background:{ color:{ value:'transparent' } },
        particles:{
          number:{ value:46 },
          color:{ value:['#ffb347','#ff7a1a','#ff4d1a','#ffd98a'] },
          shape:{ type:'circle' },
          opacity:{ value:{ min:.25, max:.95 }, animation:{ enable:true, speed:.8, sync:false } },
          size:{ value:{ min:1.2, max:4.2 } },
          move:{ enable:true, direction:'top', speed:{ min:.5, max:1.6 }, random:true, straight:false,
                 outModes:{ default:'out' }, drift:{ min:-.6, max:.6 } }
        }
      }});
      if(hwOn) hwEmbers = c; else c.destroy();
    }catch(e){ console.warn('tsParticles embers failed', e); }
  }
  hwBusy = false;
  if(hwOn) hwLoad('confetti');
}
function hwFlash(){
  const el = document.getElementById('hwFlash'); if(!el) return;
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
}
function hwScheduleFlash(){
  clearTimeout(hwFlashTimer);
  hwFlashTimer = setTimeout(() => { if(!hwOn) return; hwFlash(); hwScheduleFlash(); }, 25000 + Math.random()*40000);
}
function hwBurst(kind){
  if(!hwOn || typeof confetti !== 'function') return;
  const emoji = { shapes:['emoji'], shapeOptions:{ emoji:{ value:['\u{1F383}','\u{1F47B}','\u{1F987}','\u{1F480}','\u{1F577}\uFE0F'] } }, zIndex:200 };
  try{
    if(kind === 'winner'){
      const end = Date.now() + 3500;
      (function frame(){
        confetti({ ...emoji, particleCount:4, angle:60, spread:60, origin:{ x:0, y:.8 }, scalar:2.4, startVelocity:55, gravity:.9, ticks:260 });
        confetti({ ...emoji, particleCount:4, angle:120, spread:60, origin:{ x:1, y:.8 }, scalar:2.4, startVelocity:55, gravity:.9, ticks:260 });
        confetti({ particleCount:6, spread:80, origin:{ x:Math.random(), y:.1 }, colors:['#ff7a1a','#7CFF4B','#c1121f','#fff1de'], shapes:['circle','square'], ticks:220, zIndex:200 });
        if(Date.now() < end) setTimeout(frame, 260);
      })();
    } else {
      confetti({ ...emoji, particleCount:22, spread:100, origin:{ x:.5, y:.15 }, scalar:2, gravity:.4, ticks:140 });
    }
  }catch(e){ console.warn(e); }
}
function hwPopup(kind){ if(!hwOn) return; hwFlash(); hwBurst(kind); }
function hwSync(on){
  hwOn = on;
  const b = document.body;
  if(on){
    b.classList.add(...HW_CLASSES);
    b.setAttribute('data-halloween-start','01-01'); b.setAttribute('data-halloween-end','31-12'); /* theme is chosen by hand, so ignore the 18 Oct-2 Nov window */
    hwInit(); hwScheduleFlash();
  } else {
    b.classList.remove(...HW_CLASSES);
    b.removeAttribute('data-halloween-start'); b.removeAttribute('data-halloween-end');
    if(hwEmbers){ hwEmbers.destroy(); hwEmbers = null; }
    clearTimeout(hwFlashTimer);
  }
}
/* hide the mouse cursor on the TV after 3s of no movement */
let idleT; function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); }
['mousemove','mousedown','keydown','touchstart'].forEach(e => document.addEventListener(e, wake, { passive:true })); wake();

const THEME_ICONS = { dark:'🌙', light:'☀️', beach:'🌴', dink:'💗', mix:'🩵', mixbold:'🧡', mixhi:'🎨', halloween:'🎃' };
function applyTheme(t){
  if(!THEME_ICONS[t]) t = 'dark';
  html.setAttribute('data-theme', t); themeKnob.textContent = THEME_ICONS[t];
  try{ localStorage.setItem('pkl-tv-theme', t); }catch(e){}
  document.querySelectorAll('#tmList button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  paintTitle();
  hwSync(t === 'halloween');
  setTimeout(() => window.dispatchEvent(new Event('resize')), 60); /* re-fit names after the font swap */
}
/* Mix & Match themes: alternate header words blue / salmon like the poster */
const titleEl = document.getElementById('sessionTitle');
let paintingTitle = false;
function paintTitle(){
  if(paintingTitle) return;
  paintingTitle = true;
  const txt = titleEl.textContent;
  const mm = /^mix/.test(html.getAttribute('data-theme') || '');
  if(mm){
    titleEl.textContent = '';
    txt.split(/\s+/).filter(Boolean).forEach((w,i) => {
      const sp = document.createElement('span');
      sp.className = 'mmw ' + (i % 2 ? 'b' : 'a'); sp.textContent = w;
      titleEl.appendChild(sp);
    });
  } else if(titleEl.querySelector('.mmw')){
    titleEl.textContent = txt.replace(/\s+/g,' ').trim();
  }
  paintingTitle = false;
}
new MutationObserver(() => { if(!paintingTitle && !titleEl.querySelector('.mmw') && /^mix/.test(html.getAttribute('data-theme')||'')) paintTitle(); })
  .observe(titleEl,{childList:true});
const urlTheme = new URLSearchParams(location.search).get('theme');
let savedTheme = null; try{ savedTheme = localStorage.getItem('pkl-tv-theme'); }catch(e){}
applyTheme(urlTheme || savedTheme || 'dark');
themeToggle.addEventListener('click', () => applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
/* hidden corner menu */
const tmMenu = document.getElementById('themeMenu');
document.getElementById('tmBtn').addEventListener('click', e => { e.stopPropagation(); tmMenu.classList.toggle('open'); });
document.querySelectorAll('#tmList button').forEach(b => b.addEventListener('click', () => { applyTheme(b.dataset.t); tmMenu.classList.remove('open'); }));
document.addEventListener('click', e => { if(!tmMenu.contains(e.target)) tmMenu.classList.remove('open'); });

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let queueMatches = [];
let bucketsMap = {};
/* bucket name is shown only for buckets limited to specific courts */
function bucketTag(id){
  const b = bucketsMap[id];
  return b && b.courts && b.courts.length && b.courts.length < COURTS ? b.name : '';
}
db.collection('pkl-queue-buckets').onSnapshot(snap => {
  bucketsMap = {};
  snap.docs.forEach(d => { const x = d.data(); bucketsMap[d.id] = { name: x.name || '', courts: Array.isArray(x.courts) ? x.courts.map(Number) : [] }; });
  renderCourts();
  renderNextList();
}, err => console.error(err));

db.collection('pkl-queue-matches').onSnapshot(snap => {
  queueMatches = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  renderCourts();
  renderNextList();
}, err => console.error(err));

function courtBucketHtml(m){ const t = bucketTag(m.bucket); return t ? `<span class="court-bucket">${escapeHtml(t)}</span>` : ''; }
function playersHtml(team){ return `<div class="team">${team.map(p=>`<div class="p fit">${escapeHtml(p.name)}</div>`).join('')}</div>`; }

function renderCourts(){
  const occupying = queueMatches.filter(m => m.status==='assigned' || m.status==='playing');
  for (let c=1;c<=COURTS;c++){
    const el = document.getElementById('court-'+c);
    const m = occupying.find(x => x.court === c);
    if (!m) {
      el.className = 'court-card';
      el.innerHTML = `
        <div class="court-num">Court ${c}<span class="court-status-pill free">Available</span></div>
        <div class="free-label">Open court</div>`;
      continue;
    }
    const body = `
      <div class="players">
        ${playersHtml(m.team1)}
        <div class="vs">VS</div>
        ${playersHtml(m.team2)}
      </div>`;
    if (m.status === 'playing'){
      el.className = 'court-card playing';
      el.innerHTML = `
        <div class="court-num"><span>Court ${c}${courtBucketHtml(m)}</span><span class="court-status-pill playing">Playing</span></div>
        ${body}
        <div class="timer" data-started="${m.startedAt}">00:00</div>`;
    } else {
      el.className = 'court-card assigned';
      el.innerHTML = `
        <div class="court-num"><span>Court ${c}${courtBucketHtml(m)}</span><span class="court-status-pill assigned">Getting ready</span></div>
        ${body}
        <div class="ready-note">Please proceed to the court</div>`;
    }
  }
  updateTimers();
  fitAll();
}
function updateTimers(){
  document.querySelectorAll('.timer').forEach(el => {
    const started = Number(el.dataset.started);
    if (!started) return;
    const secs = Math.max(0, Math.floor((Date.now() - started) / 1000));
    const txt = `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
    if (el.dataset.t !== txt){
      el.dataset.t = txt;
      el.innerHTML = [...txt].map(ch => ch === ':' ? '<i class="c">:</i>' : `<i>${ch}</i>`).join('');
    }
    const card = el.closest('.court-card');
    if (card) card.style.setProperty('--bl', Math.min(36, 5 + secs / 60 * 1.5).toFixed(1)); /* Halloween: blood rises ~1.5% per minute, max 36% */
  });
}
setInterval(updateTimers, 1000);

const NEXT_SLOTS = 6;
function renderNextList(){
  const list = queueMatches.filter(m => m.status === 'waiting' || m.status === 'onhold').sort((a,b) => a.order - b.order).slice(0, NEXT_SLOTS);
  const el = document.getElementById('nextList');
  let html = '';
  for (let i=0;i<NEXT_SLOTS;i++){
    const m = list[i];
    if (!m) {
      html += `<div class="next-item empty"><div class="pos">${i+1}</div><div class="info"><div class="empty-text">—</div></div></div>`;
      continue;
    }
    html += `
    <div class="next-item${m.status === 'onhold' ? ' onhold' : ''}">
      <div class="pos">${i+1}</div>
      <div class="info">
        <div class="tline fit">${escapeHtml(m.team1.map(p=>p.name).join(' & '))}</div>
        <div class="tline b fit"><span>VS</span>${escapeHtml(m.team2.map(p=>p.name).join(' & '))}</div>
      </div>
      ${(bucketTag(m.bucket) || m.status === 'onhold') ? `<div class="side">${bucketTag(m.bucket) ? `<div class="bucket-sm">${escapeHtml(bucketTag(m.bucket))}</div>` : ''}${m.status === 'onhold' ? '<div class="hold-tag">(On Hold)</div>' : ''}</div>` : ''}
    </div>`;
  }
  el.innerHTML = html;
  fitAll();
}

/* shrink text only when a name would overflow its line, so long names stay fully visible */
function fitAll(){
  requestAnimationFrame(() => {
    document.querySelectorAll('.fit').forEach(el => {
      el.style.fontSize = '';
      let size = parseFloat(getComputedStyle(el).fontSize);
      let guard = 0;
      while (el.scrollWidth > el.clientWidth + 1 && size > 14 && guard < 120) {
        size -= 1; el.style.fontSize = size + 'px'; guard++;
      }
    });
  });
}
window.addEventListener('resize', fitAll);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

/* Session name (center of the header) */
db.collection('pkl-queue-session').doc('state').onSnapshot(doc => {
  const name = (doc.exists && doc.data().currentSessionName) || '';
  document.getElementById('sessionTitle').textContent = name;
  document.title = name ? name + ' — DUPR Engine v.1' : 'DUPR Engine v.1 — Display';
}, err => console.error(err));

/* Display settings from the admin: show/hide the queue, leaderboard popup */
let displaySettings = {};
db.collection('pkl-queue-events').doc('displaySettings').onSnapshot(doc => {
  displaySettings = doc.exists ? doc.data() : {};
  applyDisplaySettings();
}, err => console.error(err));
function applyDisplaySettings(){
  const showQueue = displaySettings.showQueue !== false;
  document.body.classList.toggle('no-queue', !showQueue);
  renderLeaderboardPopup();
  fitAll();
  setTimeout(fitAll, 150);
}
function renderLeaderboardPopup(){
  const ov = document.getElementById('lbOverlay');
  const lb = displaySettings.leaderboard;
  if (!lb || !lb.show) { ov.classList.remove('show'); return; }
  const buckets = (lb.buckets || []).slice(0, 3);
  document.getElementById('lbSub').textContent = (lb.sessionName ? lb.sessionName + ' · ' : '') + 'Top 5 per bucket';
  const cols = document.getElementById('lbCols');
  cols.style.gridTemplateColumns = `repeat(${Math.max(1, buckets.length)}, 1fr)`;
  cols.innerHTML = buckets.map(b => `
    <div class="lb-col">
      <h3>${escapeHtml(b.name)}</h3>
      ${(b.rows && b.rows.length) ? b.rows.map(r => `
        <div class="lb-row">
          <div class="lb-rank">${r.rank}</div>
          <div class="lb-name fit">${escapeHtml(r.name)}</div>
          <div class="lb-stat"><b>${r.w}</b> W<br>${r.pf} pts</div>
        </div>`).join('') : `<div class="lb-empty">No results yet</div>`}
    </div>`).join('');
  ov.classList.add('show');
  fitAll();
}

/* TV events: call players / winner popups */
let eventsInitialized = false;
let lastEventId = null;
db.collection('pkl-queue-events').orderBy('createdAt','desc').limit(1).onSnapshot(snap => {
  if (snap.empty) { eventsInitialized = true; return; }
  const doc = snap.docs[0];
  const data = doc.data();
  if (!data.createdAt) return; // still-pending serverTimestamp write; wait for the confirmed snapshot
  if (!eventsInitialized) { eventsInitialized = true; lastEventId = doc.id; return; }
  if (doc.id === lastEventId) return;
  lastEventId = doc.id;
  const ageMs = Date.now() - data.createdAt.toMillis();
  if (ageMs > 15000) return;
  if (data.type === 'call') showCallPopup(data);
  else if (data.type === 'winner') showWinnerPopup(data);
}, err => console.error(err));

function showCallPopup(data){
  const t1 = data.team1.join(' & ');
  const t2 = data.team2.join(' & ');
  document.getElementById('callCourt').textContent = `Court ${data.court}`;
  document.getElementById('callTeams').innerHTML = `${escapeHtml(t1)}<br><span style="color:var(--muted);font-size:.6em;">vs</span><br>${escapeHtml(t2)}`;
  const ov = document.getElementById('callOverlay');
  ov.classList.add('show');
  hwPopup('call');
  setTimeout(() => ov.classList.remove('show'), 5000);
}
function showWinnerPopup(data){
  const t1 = data.team1.join(' & ');
  const t2 = data.team2.join(' & ');
  const winnerNames = data.winner === 'team1' ? t1 : t2;
  document.getElementById('winnerCourt').textContent = `Court ${data.court}`;
  document.getElementById('winnerTeams').innerHTML = `${escapeHtml(t1)} <span style="color:var(--muted);font-size:.5em;">vs</span> ${escapeHtml(t2)}`;
  document.getElementById('winnerScore').textContent = `${data.score1} – ${data.score2}`;
  document.getElementById('winnerName').textContent = winnerNames;
  const ov = document.getElementById('winnerOverlay');
  ov.classList.add('show');
  hwPopup('winner');
  setTimeout(() => ov.classList.remove('show'), 5000);
}

renderCourts();
renderNextList();
</script>
</body>
</html>
