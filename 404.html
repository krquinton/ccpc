<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Page not found | Calapan City Pickleball Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#083D5F;
    --navy-deep:#062C40;
    --gold:#FAB813;
    --gold-dark:#E5A700;
    --orange:#FF6600;
    --blue:#3992B9;
    --red:#BB1421;

    --bg:#FAF8F2;
    --ink:#0F2B3D;
    --ink-soft:#5C7480;
    --line:#E4E1D6;

    --display:'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  :focus-visible{outline:3px solid var(--gold); outline-offset:3px; border-radius:6px;}

  /* ---------- Brand strip + nav (same as the main site) ---------- */
  .brand-strip{display:flex; height:5px;}
  .brand-strip span{flex:1;}
  .brand-strip .c1{background:var(--gold);}
  .brand-strip .c2{background:var(--orange);}
  .brand-strip .c3{background:var(--navy);}
  .brand-strip .c4{background:var(--blue);}
  .brand-strip .c5{background:var(--red);}

  .nav{
    background:rgba(250,248,242,0.92);
    border-bottom:1px solid var(--line);
    padding:14px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .nav .brand{
    display:flex; align-items:center; gap:10px;
    font-family:var(--display);
    font-weight:600;
    font-size:17px;
    color:var(--navy);
    text-decoration:none;
  }
  .nav .brand .mark{
    width:34px; height:34px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    overflow:hidden;
  }
  .nav .brand .mark img{width:100%; height:100%; object-fit:contain; display:block;}
  .nav-cta{
    background:var(--navy);
    color:#fff;
    padding:9px 18px;
    border-radius:999px;
    font-weight:600;
    font-size:13.5px;
    text-decoration:none;
    transition:background .15s ease;
  }
  .nav-cta:hover{background:var(--navy-deep);}
  @media (max-width:520px){
    .nav{padding:12px 20px;}
    .nav .brand{font-size:15px;}
  }

  /* ---------- Hero ---------- */
  .hero{
    flex:1;
    display:flex;
    align-items:center;
    background:var(--navy);
    background-image:radial-gradient(circle at 85% 20%, rgba(250,184,19,0.14), transparent 55%);
    color:#fff;
    padding:56px 32px;
    overflow:hidden;
  }
  .hero-inner{
    width:100%;
    max-width:1160px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1.05fr 0.95fr;
    gap:40px;
    align-items:center;
  }
  @media (max-width:900px){
    .hero{padding:44px 24px 36px;}
    .hero-inner{grid-template-columns:1fr; gap:28px;}
  }

  .hero h1{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(38px, 6vw, 64px);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 20px;
    max-width:12ch;
  }
  .hero p.sub{
    font-size:17px;
    color:rgba(255,255,255,0.78);
    max-width:44ch;
    margin:0 0 20px;
  }
  .tried{
    display:none;
    align-items:center;
    gap:10px;
    max-width:100%;
    margin:0 0 28px;
    font-size:14px;
    color:rgba(255,255,255,0.65);
  }
  .tried.show{display:flex;}
  .tried span{white-space:nowrap; flex-shrink:0;}
  .tried code{
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:13px;
    color:#fff;
    background:rgba(255,255,255,0.09);
    border:1px solid rgba(255,255,255,0.18);
    padding:4px 10px;
    border-radius:6px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
  }

  .hero-actions{
    display:flex;
    align-items:center;
    gap:22px;
    flex-wrap:wrap;
  }
  .btn-primary{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--gold);
    color:var(--navy-deep);
    font-weight:700;
    font-size:15.5px;
    padding:15px 26px;
    border-radius:8px;
    text-decoration:none;
    transition:transform .12s ease, background .12s ease;
  }
  .btn-primary:hover{background:var(--gold-dark); transform:translateY(-1px);}
  .btn-ghost{
    color:#fff;
    font-weight:600;
    font-size:14.5px;
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,0.35);
    padding-bottom:2px;
  }
  .btn-ghost:hover{border-color:#fff;}

  .errcode{
    margin:40px 0 0;
    padding-top:22px;
    border-top:1px solid rgba(255,255,255,0.14);
    font-size:13px;
    color:rgba(255,255,255,0.6);
  }
  .errcode strong{
    font-family:var(--display);
    font-weight:600;
    font-size:15px;
    color:var(--gold);
    margin-right:6px;
  }

  /* ---------- Court ---------- */
  .court-wrap{display:flex; justify-content:center;}
  .court-wrap svg{width:100%; max-width:390px; height:auto; overflow:visible;}
  @media (max-width:900px){
    .court-wrap svg{max-width:260px;}
  }

  /* One moment of motion: the ball lands outside the sideline. */
  .fly{animation:fly 1.05s cubic-bezier(.25,.6,.35,1) both;}
  .hop{animation:hop 1.7s linear both;}
  .shade{animation:shade 1.05s ease-out both;}
  .pop, .ring{transform-box:fill-box; transform-origin:center;}
  .pop{animation:pop .4s 1.05s cubic-bezier(.3,1.6,.5,1) both;}
  .ring{animation:ring .9s 1.05s ease-out both;}

  @keyframes fly{
    from{transform:translate(-190px,-170px);}
    to{transform:translate(0,0);}
  }
  @keyframes hop{
    0%{transform:scale(1.5);}
    30%{transform:scale(2.1);}
    62%{transform:scale(1);}
    76%{transform:scale(1.4);}
    88%{transform:scale(1);}
    95%{transform:scale(1.12);}
    100%{transform:scale(1);}
  }
  @keyframes shade{from{opacity:.05;} to{opacity:.3;}}
  @keyframes pop{from{transform:scale(.5); opacity:0;} to{transform:scale(1); opacity:1;}}
  @keyframes ring{from{transform:scale(.6); opacity:.9;} to{transform:scale(2.6); opacity:0;}}

  @media (prefers-reduced-motion:reduce){
    .fly,.hop,.shade,.pop,.ring{animation:none;}
    .shade{opacity:.3;}
    .ring{opacity:0;}
  }

  footer{
    padding:28px 32px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
  }
</style>
